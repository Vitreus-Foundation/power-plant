name: dev-ops

services:
  validator:
    image: vitreusfoundation/power-plant:testnet-latest
    container_name: power-plant-validator
    restart: always
    volumes:
      - node_data:/tmp/node
    command:
      - ./target/release/vitreus-power-plant-node
      - --base-path
      - /tmp/node
      - --chain
      - ./target/release/vitreus-power-plant-testnet.json
      - --name
      - ${NODE_NAME:?Set NODE_NAME to this validator's node name}
      - --port
      - "30333"
      - --rpc-port
      - "9944"
      - --rpc-methods=unsafe
      - --validator
      - --prometheus-external
      - --rpc-cors
      - all
      - --sync
      - warp

    ports:
      - "0.0.0.0:30333:30333/tcp"
      - "127.0.0.1:9944:9944/tcp"
      - "127.0.0.1:9615:9615/tcp"
    networks:
      - vitreus_power_plant_network

volumes:
  node_data:
    driver: local

networks:
  vitreus_power_plant_network:
    name: vitreus_power_plant
