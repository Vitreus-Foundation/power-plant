name: Code Hygiene

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - testnet
      - stagenet
      - mainnet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "cargo check"
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: rustfmt clippy rust-src

      - run: sudo apt-get install protobuf-compiler jq ripgrep libclang-dev libssl-dev -y

      - name: Set feature flag
        id: feature
        run: |
          if [[ "${{ github.ref_name }}" == "mainnet" ]]; then
            echo "FEATURE_FLAG=mainnet-native" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "stagenet" ]]; then
            echo "FEATURE_FLAG=mainnet-native" >> $GITHUB_ENV
          else
            echo "FEATURE_FLAG=testnet-native" >> $GITHUB_ENV
          fi

      - run: cargo build --locked -features $FEATURE_FLAG

      - run: cargo test -features $FEATURE_FLAG --workspace --locked

      - name: Check format
        run: |
          rustup toolchain add nightly-x86_64-unknown-linux-gnu
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          cargo +nightly fmt -- --check

      - run: cargo clippy -features $FEATURE_FLAG --all-targets -- --deny warnings
