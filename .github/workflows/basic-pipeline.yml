name: Code Hygiene

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The toolchain from rust-toolchain.toml: every option in rustfmt.toml is stable.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - run: cargo fmt -- --check

  rust:
    name: "cargo clippy, build, test"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        feature: [testnet-native, mainnet-native]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy rust-src

      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libssl-dev

      # Before build and test: check mode reports compile errors and lints sooner.
      - run: cargo clippy --locked --features ${{ matrix.feature }} --workspace --all-targets -- --deny warnings

      - run: cargo build --locked --features ${{ matrix.feature }}

      - run: cargo test --features ${{ matrix.feature }} --workspace --locked
