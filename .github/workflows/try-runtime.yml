name: try-runtime

# Runs .github/scripts/try-runtime.sh on mainnet and testnet. Informational: the check isn't
# required, so a failure doesn't block the merge.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "pallets/**"
      - "precompiles/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/**/try-runtime*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  on-runtime-upgrade:
    name: "on-runtime-upgrade"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        network: [mainnet, testnet]

    env:
      CARGO_TERM_COLOR: always
      NETWORK: ${{ matrix.network }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
          components: rust-src
          # A cache would have to be saved by runs on main, and it would share the repository's
          # cache limit with the caches of ci.yml.
          cache: false

      - name: Install try-runtime-cli
        run: |
          .github/scripts/try-runtime.sh install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the ${{ matrix.network }} runtime with try-runtime
        run: .github/scripts/try-runtime.sh build "$NETWORK"

      - name: Run the migrations on the ${{ matrix.network }} state
        run: .github/scripts/try-runtime.sh check "$NETWORK"

      # The state the check failed on, to rerun it locally with `snap --path`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: try-runtime-${{ matrix.network }}-state
          path: target/try-runtime/${{ matrix.network }}.snap
          if-no-files-found: ignore
          retention-days: 7
