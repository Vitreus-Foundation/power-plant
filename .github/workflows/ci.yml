name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "cargo fmt"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # The toolchain from rust-toolchain.toml: every option in rustfmt.toml is stable.
      # A third-party action, so it is pinned to a commit, here and below.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false

      - run: cargo fmt -- --check

  zepter:
    name: "zepter"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      # Newer releases need a newer Rust than rust-toolchain.toml.
      - run: cargo install zepter@1.82.1 --locked -q

      # Zepter reads `cargo metadata` offline, so the sources must be fetched first.
      - run: cargo fetch --locked

      - run: zepter run check

  rust:
    name: "cargo clippy, build, test"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        feature: [testnet-native, mainnet-native]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          components: clippy rust-src

      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libssl-dev

      # Before build and test: check mode reports compile errors and lints sooner.
      # Clippy lints only native code, so it skips the wasm build; `cargo build` does it.
      - run: cargo clippy --locked --features ${{ matrix.feature }} --workspace --all-targets -- --deny warnings
        env:
          SKIP_WASM_BUILD: 1

      - run: cargo build --locked --features ${{ matrix.feature }}

      - run: cargo test --features ${{ matrix.feature }} --workspace --locked
