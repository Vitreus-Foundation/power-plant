[package]
name = "pallet-nac-managing"
version = "0.1.0"
authors.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
log = { workspace = true }

frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-balances = { workspace = true }
pallet-claiming = { workspace = true }
pallet-energy-fee = { workspace = true }
pallet-nfts = { workspace = true }
pallet-reputation = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-arithmetic = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-staking = { workspace = true }
sp-std = { workspace = true }

[dev-dependencies]
pallet-simple-vesting = { workspace = true }
pallet-vesting = { workspace = true }
frame-benchmarking = { workspace = true }
pallet-assets = { workspace = true }
pallet-privileges = { workspace = true }
rand_chacha = { workspace = true }
sp-tracing = { workspace = true }
substrate-test-utils = { workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
    "pallet-vesting/runtime-benchmarks",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-assets/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-claiming/runtime-benchmarks",
    "pallet-energy-fee/runtime-benchmarks",
    "pallet-nfts/runtime-benchmarks",
    "pallet-privileges/runtime-benchmarks",
    "pallet-reputation/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "sp-staking/runtime-benchmarks",
]
std = [
    "pallet-simple-vesting/std",
    "pallet-vesting/std",
    "frame-benchmarking/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
    "pallet-assets/std",
    "pallet-balances/std",
    "pallet-claiming/std",
    "pallet-energy-fee/std",
    "pallet-nfts/std",
    "pallet-privileges/std",
    "pallet-reputation/std",
    "parity-scale-codec/std",
    "rand_chacha/std",
    "scale-info/std",
    "sp-arithmetic/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-staking/std",
    "sp-std/std",
    "sp-tracing/std",
]
try-runtime = [
    "pallet-simple-vesting/try-runtime",
    "pallet-vesting/try-runtime",
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-assets/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-claiming/try-runtime",
    "pallet-energy-fee/try-runtime",
    "pallet-nfts/try-runtime",
    "pallet-privileges/try-runtime",
    "pallet-reputation/try-runtime",
    "sp-runtime/try-runtime",
]
