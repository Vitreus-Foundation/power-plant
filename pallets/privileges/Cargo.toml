[package]
name = "pallet-privileges"
version = "0.1.0"
authors.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]


[dependencies]
pallet-assets = { workspace = true }
chrono = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-claiming = { workspace = true }
pallet-energy-generation = { workspace = true }
pallet-nac-managing = { workspace = true }
pallet-nfts = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-vesting = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-arithmetic = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-session = { workspace = true }
sp-runtime = { workspace = true }
sp-staking = { workspace = true }
sp-std = { workspace = true }
log = { workspace = true }

frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
pallet-energy-fee = { workspace = true }
pallet-authorship = { workspace = true }
pallet-session = { workspace = true }
pallet-balances = { workspace = true }
pallet-reputation = { workspace = true }
pallet-staking-reward-curve = { workspace = true }
rand_chacha = { workspace = true }
sp-tracing = { workspace = true }
libsecp256k1 = "0.7.0"
substrate-test-utils = { workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
    "pallet-energy-fee/runtime-benchmarks",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-assets/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-claiming/runtime-benchmarks",
    "pallet-energy-generation/runtime-benchmarks",
    "pallet-nac-managing/runtime-benchmarks",
    "pallet-nfts/runtime-benchmarks",
    "pallet-reputation/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-vesting/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "sp-staking/runtime-benchmarks",
]
std = [
    "pallet-energy-fee/std",
    "chrono/std",
    "frame-benchmarking/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
    "pallet-assets/std",
    "pallet-authorship/std",
    "pallet-balances/std",
    "pallet-claiming/std",
    "pallet-energy-generation/std",
    "pallet-nac-managing/std",
    "pallet-nfts/std",
    "pallet-reputation/std",
    "pallet-session/std",
    "pallet-timestamp/std",
    "pallet-vesting/std",
    "parity-scale-codec/std",
    "rand_chacha/std",
    "scale-info/std",
    "sp-arithmetic/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-staking/std",
    "sp-std/std",
    "sp-tracing/std",
]
try-runtime = [
    "pallet-energy-fee/try-runtime",
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-assets/try-runtime",
    "pallet-authorship/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-claiming/try-runtime",
    "pallet-energy-generation/try-runtime",
    "pallet-nac-managing/try-runtime",
    "pallet-nfts/try-runtime",
    "pallet-reputation/try-runtime",
    "pallet-session/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-vesting/try-runtime",
    "sp-runtime/try-runtime",
]

